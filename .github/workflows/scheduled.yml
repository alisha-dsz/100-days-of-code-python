
name: Daily Birthday Wisher

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  birthday-wisher:
    runs-on: ubuntu-latest

    steps:
      - name: Get my code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pandas
        run: pip install -r Day-032-Automated-Birthday-Wisher/requirements.txt

      - name: Run Birthday Wisher
        env:
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_PASSWORD: ${{ secrets.MY_PASSWORD }}
        run: python Day-032-Automated-Birthday-Wisher/main.py
